<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web GIS Evakuasi Ketep Modern</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', system-ui, -apple-system, sans-serif; overflow: hidden; }
        
        #map { width: 100vw; height: 100vh; z-index: 1; }

        /* Modern Glassmorphism Header */
        .glass-panel {
            position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px; padding: 12px 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand-title { display: flex; align-items: center; gap: 10px; }
        .brand-icon {
            background: #ef4444; color: white; width: 36px; height: 36px;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
        }
        .brand-text h1 { margin: 0; font-size: 14px; font-weight: 800; color: #1e293b; letter-spacing: -0.3px; }
        .brand-text p { margin: 0; font-size: 10px; color: #64748b; font-weight: 600; }

        /* Custom Floating Action Buttons (FAB) */
        .fab-group {
            position: absolute; bottom: 24px; right: 16px; z-index: 1000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .fab-btn {
            width: 48px; height: 48px; border-radius: 14px; border: none;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px);
            color: #1e293b; font-size: 18px; cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18); transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .fab-btn:active { transform: scale(0.92); }
        .fab-btn.primary { background: #2563eb; color: white; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); }

        /* Leaflet Control Overrides */
        .leaflet-routing-container {
            border-radius: 14px !important; backdrop-filter: blur(10px) !important;
            background: rgba(255, 255, 255, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15) !important;
        }
    </style>
</head>
<body>

    <!-- Header Glassmorphism -->
    <div class="glass-panel">
        <div class="brand-title">
            <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <div class="brand-text">
                <h1>SI-EVAKUASI KETEP</h1>
                <p id="status-gps"><i class="fa-solid fa-circle-dot" style="color:#22c55e;"></i> GPS Siap</p>
            </div>
        </div>
    </div>

    <!-- Peta Utama -->
    <div id="map"></div>

    <!-- Tombol Aksi Cepat (FAB) -->
    <div class="fab-group">
        <button class="fab-btn primary" title="Posisi Saya" onclick="lacakLokasi()"><i class="fa-solid fa-crosshairs"></i></button>
        <button class="fab-btn" title="Mode Satelit / Peta" onclick="toggleBasemap()"><i class="fa-solid fa-layer-group"></i></button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="app.js"></script>
</body>
</html>
